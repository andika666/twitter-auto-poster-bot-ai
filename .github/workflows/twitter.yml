name: Auto Tweet Using AI

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    name: Auto Tweet Using AI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Dependencies
        run: npm i

      - name: Check Secrets Existence
        env:
          APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
          APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
        run: |
          if [ -z "$APP_KEY" ] || [ -z "$APP_SECRET" ]; then
            echo "ERROR: TWITTER_APP_KEY atau TWITTER_APP_SECRET kosong! Cek GitHub Secrets."
            exit 1
          fi

      - name: Run Twitter bot
        env:
          TWITTER_APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
          TWITTER_APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm start
